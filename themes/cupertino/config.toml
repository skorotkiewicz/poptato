# Cupertino · a floating Spotlight-style search panel
[menu]
width = 672
lines = 7
placement = "top"
margin = 160
tabs_position = "bottom"
prompt = "Spotlight Search"
empty_message = "No Results"

[theme]
font_family = "Inter"
font_size = 15
icon_size = 24
padding = 10
spacing = 6
row_padding = 6
border_width = 1
radius = 19
background = "#F4F5F9ED"
foreground = "#21252C"
muted = "#55606C"
input_background = "#FFFFFF00"
border_color = "#7F89965C"
selected_background = "#CCDFF5"
selected_foreground = "#152F4E"
css = "theme.css"

# For a dark panel, replace the matching colors above.
# background = "#262930F0"
# foreground = "#F3F4F7"
# muted = "#B5BDC8"
# border_color = "#FFFFFF38"
# selected_background = "#344F6E"
# selected_foreground = "#F0F6FF"

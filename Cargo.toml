[package]
name = "poptato"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fuzzy-matcher = "0.3"
gio-unix = "0.22"
gtk = { package = "gtk4", version = "0.11" }
gtk4-layer-shell = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
shlex = "1.3"
toml = "0.9"
vte4 = { version = "0.10", optional = true }

[features]
default = ["layer-shell"]
layer-shell = ["dep:gtk4-layer-shell"]
terminal = ["dep:vte4", "gtk/v4_10"]
